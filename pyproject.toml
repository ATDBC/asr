[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-transcriber"
version = "0.1.0"
description = "Deterministic offline Mandarin transcription with speaker diarization"
requires-python = ">=3.11,<3.12"
dependencies = [
  "modelscope[framework]==1.36.3",
  "numpy==2.4.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "soundfile==0.13.1",
  "fastcluster==1.3.0",
  "umap-learn==0.5.12",
  "hdbscan==0.8.42",
  "psutil==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1"]

[project.scripts]
funasr-transcribe = "funasr_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
